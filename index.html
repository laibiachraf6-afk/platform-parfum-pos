[hidden]{display:none!important}
:root{
 --font:'Inter','Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
 --bg:#0c0a12; --text:#f5efe4; --muted:#b9ae9f; --faint:#847a6e;
 --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.11); --glass-b:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.28);
 --gold:#e6b450; --gold-2:#f3d27d; --rose:#d4607f; --teal:#3fb3c2; --ok:#4fd08a; --warn:#f2b441; --bad:#ef6a6a;
 --shadow:0 10px 40px rgba(0,0,0,.35); --blur:blur(26px) saturate(170%);
 --blob1:rgba(230,180,80,.38); --blob2:rgba(212,96,127,.30); --blob3:rgba(63,179,194,.28);
 --input:rgba(0,0,0,.28); --on-gold:#2a1c05;
}
:root[data-theme=light]{
 --bg:#f4ede3; --text:#2a2018; --muted:#6d6153; --faint:#988b7b;
 --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.85); --glass-hi:#fff;
 --gold:#b9801b; --gold-2:#d29a2e; --shadow:0 10px 36px rgba(90,60,20,.14);
 --blob1:rgba(230,180,80,.55); --blob2:rgba(212,96,127,.30); --blob3:rgba(63,179,194,.30); --input:rgba(255,255,255,.7); --on-gold:#fff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;overflow:hidden}
.bg{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;background:
 radial-gradient(42vmax 42vmax at 85% 10%,var(--blob1),transparent 65%),
 radial-gradient(38vmax 38vmax at 8% 85%,var(--blob2),transparent 65%),
 radial-gradient(34vmax 34vmax at 55% 55%,var(--blob3),transparent 70%),var(--bg)}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:22px}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(30,26,40,.92)}:root[data-theme=light] .glass{background:rgba(255,255,255,.92)}}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(30,26,40,.95)}:root[data-theme=light] .glass{background:#fff}}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px} svg.i.lg{width:26px;height:26px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--glass-b);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:.15s}
select option{background:#1d1826;color:#f5efe4}
:root[data-theme=light] select option{background:#fff;color:#2a2018}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-b);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--glass-b);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--on-gold);border-color:transparent;font-weight:600;box-shadow:0 6px 20px color-mix(in srgb,var(--gold) 35%,transparent)}
.btn.bad{color:var(--bad)} .btn.sm{padding:6px 10px;font-size:13px;border-radius:10px} .btn.ic{padding:8px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
/* login */
#login{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;padding:20px;overflow:auto}
.lcard{width:min(420px,100%);padding:34px 30px;text-align:center}
.logo{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--on-gold);box-shadow:0 10px 30px color-mix(in srgb,var(--gold) 40%,transparent)}
.logo svg{width:34px;height:34px}
.lcard h1{font-size:26px;font-weight:700} .lcard p.sub{color:var(--muted);margin:4px 0 22px}
.lcard .row{text-align:start;margin-bottom:14px} .pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* shell */

#side{display:flex;flex-direction:column;padding:16px 12px;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px}
.brand .logo{width:42px;height:42px;margin:0;border-radius:13px}.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12px}
nav{overflow:auto;flex:1;display:flex;flex-direction:column;gap:3px;padding:2px}
nav .grp{font-size:11.5px;color:var(--faint);padding:12px 12px 4px;letter-spacing:.3px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--muted);cursor:pointer;transition:.15s;border:1px solid transparent}
nav a:hover{background:var(--glass);color:var(--text)}
nav a.on{background:var(--glass-2);border-color:var(--glass-b);color:var(--gold-2);font-weight:600;box-shadow:inset 0 1px 0 var(--glass-hi)}
:root[data-theme=light] nav a.on{color:var(--gold)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--glass-b);margin-top:8px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);font-weight:700;color:var(--gold-2)}
.me div{flex:1;min-width:0}.me b,.me small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--muted);font-size:12px}
#main{display:flex;flex-direction:column;min-width:0;gap:14px;min-height:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px}
#top h2{font-size:19px;flex:1;font-weight:600}
#menuBtn{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.off{background:var(--warn);box-shadow:0 0 10px var(--warn)}
#top select{width:auto;padding:7px 10px;border-radius:99px}
#view{flex:1;overflow:auto;padding:2px 2px 20px;min-height:0}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.page-h h3{font-size:20px;flex:1;min-width:150px}
.card{padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi{padding:18px;position:relative;overflow:hidden}.kpi .l{color:var(--muted);font-size:13.5px;display:flex;gap:8px;align-items:center}
.kpi .v{font-size:27px;font-weight:700;margin-top:6px;letter-spacing:-.3px}.kpi .s{font-size:12.5px;color:var(--faint)}
.kpi .ico{position:absolute;left:14px;top:14px;opacity:.9;color:var(--gold-2);background:var(--glass);border-radius:12px;padding:8px}
.tw{overflow:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;text-align:start;font-weight:500;color:var(--muted);padding:11px 12px;background:var(--glass-2);white-space:nowrap;font-size:13px}
td{padding:11px 12px;border-top:1px solid var(--glass-b);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.04)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--glass-2);border:1px solid var(--glass-b)}
.b-ok{color:var(--ok)}.b-warn{color:var(--warn)}.b-bad{color:var(--bad)}.b-info{color:var(--teal)}.b-gold{color:var(--gold-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.filters>*{flex:1;min-width:140px}.filters .btn{flex:none}
.empty{text-align:center;padding:40px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--muted)}
.bars .b i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:linear-gradient(to top,var(--gold),var(--gold-2));min-height:3px}
.hb{margin:10px 0}.hb .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}.hb .r{height:8px;border-radius:9px;background:var(--glass)}.hb .r i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--gold))}
/* modal */
#modals{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;pointer-events:none}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(5,3,10,.55);display:grid;place-items:center;padding:16px;pointer-events:auto;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mod{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--bg);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.mod.wide{width:min(900px,100%)}
.mod header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--glass-b)}.mod header h4{flex:1;font-size:17px}
.mod .bd{padding:18px 20px;overflow:auto}.mod footer{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--glass-b);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w2{grid-column:1/-1}
#toast{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;z-index:80;pointer-events:none}

/* POS */
.pos{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;height:100%;min-height:0}
.pos>.glass{display:flex;flex-direction:column;min-height:0;padding:14px}
.tabs{display:flex;gap:6px;padding:4px;background:var(--glass);border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 10px;border-radius:11px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:7px;font-size:14px}
.tabs button.on{background:var(--glass-b);color:var(--text);font-weight:600;box-shadow:inset 0 1px 0 var(--glass-hi)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;margin-top:12px;padding:2px;align-content:start;flex:1}
.pc{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-b);text-align:start;transition:.15s;display:flex;flex-direction:column;gap:4px}
.pc:hover{background:var(--glass-2);transform:translateY(-2px);border-color:var(--gold)}
.pc b{font-size:14px;line-height:1.35}.pc small{color:var(--muted);font-size:12px}.pc .pr{color:var(--gold-2);font-weight:700;margin-top:auto}
.pc.low{opacity:.55}
.cart{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.cl{display:grid;grid-template-columns:1fr 88px 92px 30px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--glass-b)}
.cl input{padding:7px 8px;text-align:center;border-radius:9px}.cl .nm small{display:block;color:var(--muted);font-size:12px}
.tot{padding-top:10px;border-top:1px solid var(--glass-b);margin-top:8px}.tot .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}.tot .r.t{font-size:21px;font-weight:700;color:var(--text);padding-top:8px}
.sc{max-height:200px;overflow:auto}
.help{font-size:13px;color:var(--muted)}
#shell.rail{grid-template-columns:78px 1fr}
#shell.rail #side{padding:12px 8px;align-items:center}#shell.rail .brand{padding:4px 0 12px;flex-direction:column;gap:8px}#shell.rail .brand .bt,#shell.rail nav .grp,#shell.rail nav a .nl,#shell.rail .me>div:not(.av){display:none}
#shell.rail nav{width:100%}#shell.rail nav a{justify-content:center;padding:12px 0}#shell.rail .me{flex-direction:column;border-top:1px solid var(--glass-b);padding:10px 0 0}
#shell.rail .brand .logo.mini{display:grid}
@media (max-width:1100px) and (min-width:701px){.pos{grid-template-columns:1.1fr 1fr}.cl{grid-template-columns:1fr 70px 78px 30px}}
@media (max-width:700px){
 #shell{padding:8px;display:block;position:static;min-height:100vh}
 #side{position:fixed;top:8px;bottom:8px;right:8px;left:auto;width:280px;z-index:40;transform:translateX(120%);transition:.25s;background:var(--bg)}
 #side.open{transform:none}#menuBtn{display:inline-flex}.pos{grid-template-columns:1fr;height:auto}.fg{grid-template-columns:1fr}
 body{overflow:auto}#main{min-height:100vh}#view{overflow:visible}#top{flex-wrap:wrap}#top h2{min-width:40%}
}

}

/* ===== علامة البرنامج (نص بدل الأيقونة) ===== */

.brand .logo.mini{display:none;font-size:20px;font-weight:800;color:var(--on-gold)}
/* ===== واجهة الدخول العالمية ===== */
#login{display:block;overflow:auto;padding:0;place-items:stretch}.lg{width:100%;justify-self:stretch}

.lg-feats b{display:block;font-size:16px}.lg-feats small{display:block;color:var(--muted);font-size:13.5px;line-height:1.55}

.mbars{display:flex;align-items:flex-end;gap:7px;height:100%}.mbars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(to top,var(--gold),var(--gold-2))}

/* ===== تلميحات ===== */

/* ======== زجاج سائل (Liquid Glass) ======== */
:root{--on-ring:#fff}
.glass{position:relative;isolation:isolate;background:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 52%,rgba(255,255,255,.09));border:1px solid rgba(255,255,255,.2);box-shadow:0 22px 50px -14px rgba(0,0,0,.55),inset 0 1.5px 1px -.5px rgba(255,255,255,.62),inset 0 -1px 1px rgba(255,255,255,.1),inset 0 0 30px rgba(255,255,255,.035);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%)}
.glass:before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;z-index:-1;background:radial-gradient(130% 70% at 14% -10%,rgba(255,255,255,.27),transparent 46%),radial-gradient(70% 55% at 100% 112%,rgba(255,255,255,.09),transparent 60%)}

.mod.glass,.ov .glass{-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%)}
.btn{background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px -6px rgba(0,0,0,.4)}
.btn.pri{background:linear-gradient(160deg,#f7dc8e,var(--gold));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 22px color-mix(in srgb,var(--gold) 40%,transparent)}
.chip{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
input,select,textarea{background:rgba(255,255,255,.06);box-shadow:inset 0 2px 6px rgba(0,0,0,.25),inset 0 -1px 0 rgba(255,255,255,.08)}
:root[data-theme=light] input,:root[data-theme=light] select,:root[data-theme=light] textarea{background:rgba(255,255,255,.7);box-shadow:inset 0 1px 3px rgba(90,60,20,.12)}
/* الشريط الجانبي كبسولة زجاجية */
#side{border-radius:34px;padding:16px 12px}

 price type is chosen with the customer on the invoice."], "— اختر العميل —": ["— Choisir le client —", "— Select customer —"], "السعر لوحدة البيع": ["Prix par unité de vente", "Price per sale unit"], "إضافة عميل": ["Ajouter un client", "Add customer"], "حفظ الأسعار": ["Enregistrer les prix", "Save prices"], "قيمة سعر غير صالحة": ["Valeur de prix invalide", "Invalid price value"], "أدخل كمية العبوة": ["Saisissez la quantité du conditionnement", "Enter the pack quantity"], "أدخل سعر العبوة": ["Saisissez le prix du conditionnement", "Enter the pack price"], "توجد عبوتان بنفس الكمية": ["Deux conditionnements ont la même quantité", "Two packs have the same quantity"], "اختر العميل": ["Choisissez le client", "Select the customer"], "أدخل السعر الخاص للعميل": ["Saisissez le prix spécial du client", "Enter the customer's special price"], "عميل مكرر في الأسعار الخاصة": ["Client en double dans les prix spéciaux", "Duplicate customer in special prices"], "تم حفظ الأسعار": ["Prix enregistrés", "Prices saved"], "هامش التجزئة": ["Marge détail", "Retail margin"], "سعر الوحدة المفردة (لوحدة البيع)": ["Prix à l'unité (par unité de vente)", "Single-unit price (per sale unit)"], "السعر الخاص للعملاء التجاريين (لوحدة البيع)": ["Prix spécial clients professionnels (par unité de vente)", "Special price for trade customers (per sale unit)"], "تكلفة الشراء الفعلية (لوحدة البيع)": ["Coût d'achat réel (par unité de vente)", "Actual purchase cost (per sale unit)"], "مصروف مباشر (مرتبط بالبيع: نقل، تغليف، عمولة...)": ["Dépense directe (liée à la vente : transport, emballage, commission...)", "Direct expense (tied to sales: transport, packaging, commission...)"], "سلّم أسعار المقاسات للتركيب — تجزئة (مثال: 50 مل = 400)": ["Grille de prix des formats de composition — détail (ex. : 50 ml = 400)", "Made-to-order size price ladder — retail (e.g. 50 ml = 400)"], "سلّم أسعار المقاسات للتركيب — جملة (مثال: 50 مل = 300)": ["Grille de prix des formats de composition — gros (ex. : 50 ml = 300)", "Made-to-order size price ladder — wholesale (e.g. 50 ml = 300)"], "منع البيع بأقل من التكلفة (إن لم يُفعَّل يظهر تنبيه فقط)": ["Interdire la vente sous le coût (sinon simple avertissement)", "Block selling below cost (if off, only a warning is shown)"], "سياسة الكميات": ["Politique de quantités", "Quantity policy"], "تطبيق سعر العبوة عند مطابقة الكمية تماماً": ["Appliquer le prix du conditionnement quand la quantité correspond exactement", "Apply the pack price when the quantity matches exactly"], "عدم تغيير السعر حسب الكمية": ["Ne pas modifier le prix selon la quantité", "Do not change the price by quantity"], "إجمالي المبيعات (قبل التخفيض)": ["Total des ventes (avant remise)", "Total sales (before discount)"], "الخصومات": ["Remises", "Discounts"], "تكلفة الكمية المباعة": ["Coût des quantités vendues", "Cost of quantity sold"], "الربح الإجمالي": ["Bénéfice brut", "Gross profit"], "الربح ÷ المبيعات بعد التخفيض": ["Bénéfice ÷ ventes après remise", "Profit ÷ sales after discount"], "الزيادة على التكلفة": ["Majoration sur le coût", "Markup on cost"], "الربح ÷ التكلفة": ["Bénéfice ÷ coût", "Profit ÷ cost"], "المصاريف المباشرة": ["Dépenses directes", "Direct expenses"], "الربح بعدها": ["Bénéfice après", "Profit after"], "فواتير بأقل من التكلفة": ["Factures sous le coût", "Invoices below cost"], "حسب نوع السعر": ["Par type de prix", "By price type"], "أسطر": ["Lignes", "Lines"], "الهامش": ["Marge", "Margin"], "تنبيه": ["attention", "warning"], "لكل منتج محضّر وصفة تحددها أنت. «عند الطلب»: يخصم البيع الزيت والكحول والقارورة والمستلزمات حسب الوصفة. «تحضير مسبق»: تنشئ أمر إنتاج من صفحة «التعبئة والخلط» فيدخل المنتج النهائي المخزون، ثم يخصم البيع المنتج النهائي فقط — لا تُخصم المكونات مرتين.": ["Chaque produit préparé a une recette que vous définissez. « Sur commande » : la vente déduit l'huile, l'alcool, le flacon et les fournitures selon la recette. « Préparation à l'avance » : vous créez un ordre de production depuis la page « Remplissage et mélange », le produit fini entre en stock, puis la vente déduit uniquement le produit fini — les composants ne sont jamais déduits deux fois.", "Each prepared product has a recipe that you define. «On demand»: the sale deducts oil, alcohol, bottle and supplies per the recipe. «Pre-made»: you create a production order from the «Filling & blending» page, the finished product enters stock, then the sale deducts only the finished product — components are never deducted twice."], "الربح هنا من فواتير المنتج المحضّر فقط (قبل التخفيض)، ولا يحتسب شراء المواد ولا الإنتاج كمصروف: هما مخزون يتحول إلى تكلفة عند البيع مرة واحدة. استهلاك «عند الطلب» يُحسب من الفواتير، و«المسبق» من أوامر الإنتاج المنفّذة، فلا يتكرر.": ["Le bénéfice ici provient uniquement des factures du produit préparé (avant remise) et ne compte ni l'achat des matières ni la production comme dépense : c'est du stock qui devient un coût une seule fois à la vente. La consommation « sur commande » vient des factures, celle « à l'avance » des ordres de production exécutés, donc sans doublon.", "Profit here comes only from invoices of the prepared product (before discount) and counts neither material purchases nor production as an expense: they are stock that becomes cost once at sale. «On demand» consumption comes from invoices, «pre-made» from executed production orders, so nothing is counted twice."], "عند التأكيد تُخصم المكونات وتُضاف «الكمية الفعلية المنتجة» إلى مخزون المنتج النهائي. إن كسرت قوارير أو نقصت الكمية فاكتب الكمية الفعلية فتزيد تكلفة الوحدة تلقائياً.": ["À la confirmation, les composants sont déduits et la « quantité réellement produite » est ajoutée au stock du produit fini. Si des flacons ont cassé ou la quantité est inférieure, saisissez la quantité réelle : le coût unitaire augmente automatiquement.", "On confirmation the components are deducted and the «actual quantity produced» is added to the finished product stock. If bottles broke or the quantity is lower, enter the actual quantity and the unit cost rises automatically."], "أنشئ الأمر أولاً (لا تتحرك أي مادة)، وعند «تأكيد الإنتاج» تُخصم المكونات وتدخل الكمية الفعلية المنتجة إلى مخزون المنتج النهائي. إلغاء مسودة لا يُنشئ أي حركة مخزون.": ["Créez d'abord l'ordre (aucune matière ne bouge) ; à la « confirmation de production » les composants sont déduits et la quantité réelle produite entre au stock du produit fini. Annuler un brouillon ne crée aucun mouvement de stock.", "Create the order first (no material moves); on «confirm production» the components are deducted and the actual quantity produced enters the finished product stock. Cancelling a draft creates no stock movement."], "للمنتج «مسبق»: يُخصم المنتج النهائي من المخزون كفاقد. للمنتج «عند الطلب»: تُسجَّل المكونات المستهلكة (حسب الوصفة) كفاقد.": ["Produit « à l'avance » : le produit fini est déduit du stock comme perte. Produit « sur commande » : les composants consommés (selon la recette) sont enregistrés comme perte.", "«Pre-made» product: the finished product is deducted from stock as loss. «On demand» product: the consumed components (per the recipe) are recorded as loss."], "قارورة جاهزة في المخزون — بِعها أو سجّل إتلافها قبل تحويل الوصفة إلى «عند الطلب» حتى لا يُخصم شيء مرتين": ["flacon(s) prêt(s) en stock — vendez-les ou enregistrez leur perte avant de passer la recette en « sur commande » pour qu'aucun article ne soit déduit deux fois", "ready bottle(s) in stock — sell them or record their loss before switching the recipe to «on demand» so nothing is deducted twice"], "تعود إلى المخزون (المكونات للمنتج «عند الطلب»، أو القوارير الجاهزة للمنتج «المسبق»).": ["Retournent au stock (composants pour le produit « sur commande », ou flacons prêts pour le produit « à l'avance »).", "Return to stock (components for the «on demand» product, or ready bottles for the «pre-made» product)."], "لا تعود للمخزون وتُسجَّل كتالف بتكلفتها. المنتجات الأخرى في الفاتورة تعود كالمعتاد.": ["Ne retournent pas au stock et sont enregistrés comme détériorés à leur coût. Les autres produits de la facture reviennent normalement.", "Do not return to stock and are recorded as damaged at their cost. Other products on the invoice return as usual."], "حذف الوصفة؟ يبقى المنتج النهائي وسجلاته كمنتج عادي ولا تُمس الحركات السابقة.": ["Supprimer la recette ? Le produit fini et son historique restent comme produit ordinaire et les mouvements passés ne sont pas touchés.", "Delete the recipe? The finished product and its history remain as an ordinary product and past movements are untouched."], "لا توجد وصفة بطريقة «تحضير مسبق» — أنشئ واحدة من صفحة «وصفات العطور»": ["Aucune recette en mode « préparation à l'avance » — créez-en une depuis la page « Recettes de parfums »", "No recipe uses «pre-made» preparation — create one from the «Perfume recipes» page"], "الكمية الفعلية أكبر من المخطط — أنشئ أمراً بالكمية الصحيحة": ["La quantité réelle dépasse le plan — créez un ordre avec la bonne quantité", "The actual quantity exceeds the plan — create an order with the correct quantity"], "حدّد سعر بيع المنتج من زر الأسعار — لا يُفرض سعر تلقائياً": ["Fixez le prix de vente du produit depuis le bouton des prix — aucun prix n'est imposé automatiquement", "Set the product's selling price from the prices button — no price is imposed automatically"], "لا يمكن إلغاء أمر منفّذ — سجّل الإتلاف من «وصفات العطور»": ["Impossible d'annuler un ordre exécuté — enregistrez la perte depuis « Recettes de parfums »", "An executed order cannot be cancelled — record the loss from «Perfume recipes»"], "أنت تحدد الكميات. لا يفترض البرنامج أن الغرامات + المل": ["Vous définissez les quantités. Le logiciel ne suppose pas que grammes + ml", "You set the quantities. The software does not assume that grams + ml"], "= حجم نهائي دقيق؛ يمكنك تسجيل الحجم النهائي المقاس.": ["= volume final exact ; vous pouvez saisir le volume final mesuré.", "= an exact final volume; you can record the measured final volume."], "حجم نهائي دقيق؛ يمكنك تسجيل الحجم النهائي المقاس.": ["volume final exact ; vous pouvez saisir le volume final mesuré.", "an exact final volume; you can record the measured final volume."], "لم تختر قارورة — لن تُخصم قارورة ولن تدخل في التكلفة": ["Aucun flacon choisi — aucun flacon ne sera déduit ni compté dans le coût", "No bottle selected — no bottle will be deducted or included in the cost"], "مجموع الغرامات + المل (تقدير فقط وليس حجماً دقيقاً)": ["Total grammes + ml (estimation seulement, pas un volume exact)", "Total grams + ml (estimate only, not an exact volume)"], "عنصر القارورة يجب أن يكون من نوع «قارورة / تغليف»": ["L'élément flacon doit être de type « flacon / emballage »", "The bottle item must be of type «bottle / packaging»"], "الأغطية والملصقات ومستلزمات التعبئة (لكل قارورة)": ["Bouchons, étiquettes et fournitures de remplissage (par flacon)", "Caps, labels and filling supplies (per bottle)"], "المنتجات المحضّرة: الإنتاج والمبيعات والاستهلاك": ["Produits préparés : production, ventes et consommation", "Prepared products: production, sales and consumption"], "راجع الكميات أو سجّل الحجم النهائي المقاس": ["vérifiez les quantités ou saisissez le volume final mesuré", "review the quantities or record the measured final volume"], "الحجم النهائي المقاس لكل قارورة (مل) — اختياري": ["Volume final mesuré par flacon (ml) — facultatif", "Measured final volume per bottle (ml) — optional"], "سجّل الحجم النهائي المقاس إن كان صحيحاً": ["saisissez le volume final mesuré s'il est correct", "record the measured final volume if it is correct"], "تحضير مسبق — أمر إنتاج ثم مخزون منتج نهائي": ["Préparation à l'avance — ordre de production puis stock de produit fini", "Pre-made — production order then finished product stock"], "إلغاء مسودة الأمر؟ لن تُنشأ أي حركة مخزون.": ["Annuler le brouillon de l'ordre ? Aucun mouvement de stock ne sera créé.", "Cancel the draft order? No stock movement will be created."], "الفاقد المتوقع % (يُضاف على الزيت والكحول)": ["Perte prévue % (ajoutée à l'huile et à l'alcool)", "Expected loss % (added to oil and alcohol)"], "تكلفة القارورة (شاملة الفاقد المتوقع affichent ; en cas d'écart, choisissez son motif (obligatoire). Laissez vide pour ignorer l'article. Aucun solde ne change avant « Valider l'inventaire ».", "Weigh or count what is actually there and enter it. The theoretical balance and the difference appear; when there is a difference, choose its reason (mandatory). Leave blank to skip the item. No balance changes before \"Approve count\"."], "الرصيد النظري": ["Solde théorique", "Theoretical balance"], "الكمية الفعلية": ["Quantité réelle", "Actual quantity"], "حفظ كمسودة": ["Enregistrer comme brouillon", "Save as draft"], "صنف بفرق · قيمة النقص / الزيادة": ["article(s) avec écart · valeur du manque / surplus", "item(s) with difference · shortage / surplus value"], "كمية فعلية غير صالحة للصنف": ["Quantité réelle invalide pour l'article", "Invalid actual quantity for item"], "لم تُدخل أي كمية": ["Aucune quantité saisie", "No quantity entered"], "هذا الجرد معتمد مسبقاً": ["Cet inventaire est déjà validé", "This count is already approved"], "حُفظت مسودة الجرد": ["Brouillon d'inventaire enregistré", "Count draft saved"], "لم يتغير أي رصيد": ["Aucun solde modifié", "No balance changed"], "حدّد سبب الفرق للصنف": ["Indiquez le motif de l'écart pour l'article", "Select the reason for the difference for item"], "مراجعة الجرد قبل الاعتماد": ["Vérification de l'inventaire avant validation", "Review count before approval"], "سيُنشأ سجل حركة مستقل لكل فرق": ["Un mouvement de stock indépendant sera créé pour chaque écart", "An independent movement record will be created for each difference"], "باسم المستخدم": ["au nom de l'utilisateur", "in the user's name"], "وبالتاريخ والوقت الحاليين، وتُحدَّث الأرصدة لتصبح مساوية للكمية الفعلية. المتطابق لا يُنشئ حركة.": ["avec la date et l'heure actuelles ; les soldes sont mis à jour pour égaler la quantité réelle. Un article conforme ne crée aucun mouvement.", "with the current date and time; balances are updated to equal the actual quantity. A matching item creates no movement."], "تغيّر الرصيد النظري لـ": ["Le solde théorique a changé pour", "The theoretical balance changed for"], "صنف منذ بدء الجرد (مبيعات أو حركات أخرى): الفرق محسوب على الرصيد النظري الحالي.": ["article(s) depuis le début de l'inventaire (ventes ou autres mouvements) : l'écart est calculé sur le solde théorique actuel.", "item(s) since the count started (sales or other movements): the difference is computed on the current theoretical balance."], "النظري": ["Théorique", "Theoretical"], "لا فروق": ["Aucun écart", "No differences"], "كل الأرصدة مطابقة": ["Tous les soldes sont conformes", "All balances match"], "قيمة النقص / الزيادة": ["Valeur manque / surplus", "Shortage / surplus value"], "تأكيد الاعتماد وتسجيل الحركات": ["Confirmer la validation et enregistrer les mouvements", "Confirm approval and record movements"], "رجوع": ["Retour", "Back"], "مطابق": ["Conforme", "Matches"], "فرق · فاقد": ["écart(s) · perte", "difference(s) · loss"], "اعتُمد الجرد": ["Inventaire validé", "Count approved"], "حركة · فاقد": ["mouvement(s) · perte", "movement(s) · loss"], "آخر جرد معتمد": ["Dernier inventaire validé", "Last approved count"], "عمليات الجرد المعتمدة": ["Inventaires validés", "Approved counts"], "مسودات غير معتمدة": ["Brouillons non validés", "Unapproved drafts"], "الزيوت تُوزن بالغرام والكحول يُقاس بالمل": ["Les huiles se pèsent en grammes et l'alcool se mesure en ml", "Oils are weighed in grams and alcohol measured in ml"], "جرد سريع يومي لأكثر الزيوت حركة في نهاية الوردية.": ["Inventaire quotidien rapide des huiles les plus mouvementées en fin de service.", "Quick daily count of the fastest-moving oils at shift end."], "كل فرق يحتاج سبباً (تبخّر، انسكاب، زيادة في الصبّ...) ولا يتغير الرصيد إلا باعتماد الجرد، ويُسجَّل بحركة مستقلة باسم المستخدم ووقته.": ["Chaque écart exige un motif (évaporation, déversement, surdosage...) ; le solde ne change qu'à la validation et est enregistré par un mouvement indépendant avec l'utilisateur et l'heure.", "Every difference needs a reason (evaporation, spill, over-pouring...); the balance changes only on approval and is recorded as an independent movement with the user and time."], "المسؤول": ["Responsable", "Responsible"], "أصناف": ["Articles", "Items"], "معتمد": ["Validé", "Approved"], "حذف المسودة": ["Supprimer le brouillon", "Delete draft"], "لا يُحذف جرد معتمد": ["Un inventaire validé ne peut pas être supprimé", "An approved count cannot be deleted"], "حذف مسودة الجرد؟ لا تتأثر الأرصدة لأنها لم تُعتمد.": ["Supprimer le brouillon d'inventaire ? Les soldes ne sont pas affectés car il n'a pas été validé.", "Delete the count draft? Balances are not affected because it was never approved."], "حُذفت المسودة": ["Brouillon supprimé", "Draft deleted"], "أُنشئ": ["Créé", "Created"], "بواسطة": ["par", "by"], "اعتُمد": ["Validé", "Approved"], "حركات المخزون المنشأة": ["Mouvements de stock créés", "Stock movements created"], "المخزون والقيمة": ["Stock et valeur", "Stock and value"], "المشتريات": ["Achats", "Purchases"], "المبيعات حسب الصنف": ["Ventes par article", "Sales by item"], "جملة / تجزئة": ["Gros / Détail", "Wholesale / Retail"], "التكلفة والربح": ["Coût et bénéfice", "Cost and profit"], "نقص المخزون": ["Stock bas", "Low stock"], "فروقات الجرد": ["Écarts d'inventaire", "Stocktake differences"], "سجل الأسعار": ["Historique des prix", "Price log"], "لا توجد بيانات ضمن هذه الفلاتر": ["Aucune donnée pour ces filtres", "No data for these filters"], "تكلفة وحدة المخزون": ["Coût de l'unité de stock", "Stock unit cost"], "القيمة = الرصيد × تكلفة الشراء المسجّلة للصنف. الرصيد السالب يظهر كما هو ولا يُخفى.": ["Valeur = solde × coût d'achat enregistré de l'article. Un solde négatif s'affiche tel quel, sans être masqué.", "Value = balance × the item's recorded purchase cost. A negative balance is shown as is, never hidden."], "بدون مورّد": ["Sans fournisseur", "No supplier"], "الكمية المشتراة": ["Quantité achetée", "Quantity purchased"], "إجمالي الكلفة": ["Coût total", "Total cost"], "متوسط الكلفة / وحدة": ["Coût moyen / unité", "Average cost / unit"], "عدد الدفعات": ["Nombre de lots", "Number of batches"], "إجمالي المشتريات": ["Total des achats", "Total purchases"], "من حركات الشراء المسجّلة فقط (شراء مباشر وأوامر الشراء المستلمة).": ["À partir des mouvements d'achat enregistrés uniquement (achat direct et commandes reçues).", "From recorded purchase movements only (direct purchases and received purchase orders)."], "الخصم": ["Remise", "Discount"], "الربح هنا إجمالي (قبل المصاريف). خصم الفاتورة يُوزَّع على أسطرها بنسبة قيمتها.": ["Le bénéfice ici est brut (avant dépenses). La remise de la facture est répartie sur ses lignes au prorata de leur valeur.", "Profit here is gross (before expenses). The invoice discount is spread over its lines in proportion to their value."], "نوع البيع": ["Type de vente", "Sale type"], "نوع البيع يُؤخذ من السطر نفسه كما سُجّل في الفاتورة (جملة / تجزئة / مفرد / خاص).": ["Le type de vente est pris de la ligne telle qu'enregistrée sur la facture (gros / détail / unité / spécial).", "The sale type is taken from the line as recorded on the invoice (wholesale / retail / single / special)."], "الإيراد (قبل الخصم)": ["Chiffre d'affaires (avant remise)", "Revenue (before discount)"], "تكلفة البضاعة المباعة": ["Coût des marchandises vendues", "Cost of goods sold"], "الربح الإجمالي (قبل المصاريف)": ["Bénéfice brut (avant dépenses)", "Gross profit (before expenses)"], "هامش الربح الإجمالي": ["Marge brute", "Gross margin"], "المصاريف المسجّلة": ["Dépenses enregistrées", "Recorded expenses"], "— (لا تُنسب لصنف)": ["— (non rattachées à un article)", "— (not attributed to an item)"], "النتيجة بعد المصاريف": ["Résultat après dépenses", "Result after expenses"], "— (أزل فلتر الصنف/الفئة/النوع)": ["— (retirez le filtre article/catégorie/type)", "— (remove the item/category/type filter)"], "فاقد وإتلاف مسجّل (جرد/إتلاف) — للعلم، غير مخصوم أعلاه": ["Pertes et casse enregistrées (inventaire/casse) — pour information, non déduites ci-dessus", "Recorded loss and scrap (count/scrap) — for information, not deducted above"], "البند": ["Poste", "Item"], "الربح الإجمالي لا يشمل المصاريف ولا يُسمّى صافياً. «النتيجة بعد المصاريف» = الربح الإجمالي − المصاريف المسجّلة في نفس الفترة والفرع.": ["Le bénéfice brut n'inclut pas les dépenses et n'est pas appelé net. « Résultat après dépenses » = bénéfice brut − dépenses enregistrées sur la même période et le même site.", "Gross profit excludes expenses and is not called net. \"Result after expenses\" = gross profit − expenses recorded in the same period and branch."], "الحد الأدنى": ["Minimum", "Minimum"], "سالب — راجع الحركات": ["Négatif — vérifiez les mouvements", "Negative — review the movements"], "نفد": ["Épuisé", "Out of stock"], "يعتمد على «الحد الأدنى» المسجّل في كل صنف. الأصناف بدون حد أدنى لا تظهر إلا إذا كان رصيدها سالباً.": ["Basé sur le « minimum » enregistré pour chaque article. Les articles sans minimum n'apparaissent que si leur solde est négatif.", "Based on the \"minimum\" recorded on each item. Items with no minimum appear only when their balance is negative."], "الجرد": ["Inventaire", "Count"], "من الجرد المعتمد فقط. المسودات لا تظهر لأنها لم تغيّر أي رصيد.": ["Inventaires validés uniquement. Les brouillons n'apparaissent pas car ils n'ont changé aucun solde.", "Approved counts only. Drafts do not appear because they changed no balance."], "التاريخ والوقت": ["Date et heure", "Date and time"], "القديم": ["Ancien", "Old"], "الجديد": ["Nouveau", "New"], "المصدر": ["Source", "Source"], "يُسجَّل كل تغيير في أي سعر أو تكلفة شراء — يدوياً أو عبر الاستيراد/الشراء/الدفعات — مع المستخدم والمصدر.": ["Chaque modification de prix ou de coût d'achat — manuelle ou via import/achat/lots — est enregistrée avec l'utilisateur et la source.", "Every change to any price or purchase cost — manual or via import/purchase/batches — is recorded with the user and source."], "تقارير المخزون والمبيعات": ["Rapports stock et ventes", "Stock and sales reports"], "خطأ في تسجيل سابق": ["Erreur d'enregistrement anté
